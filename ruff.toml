# Ruff-Konfiguration fuer den ha-pro-Fork.
#
# Absicht: ein *Regressions-Gitter*, kein Stil-Diktat. Der Upstream-Code ist
# ~16k Zeilen gewachsen; der volle Ruff-Default meldet darauf 292 Treffer
# (F541 f-Strings ohne Platzhalter, F401 ungenutzte Importe, ...). Eine CI, die
# ab Tag eins rot ist, liest niemand. Deshalb wird nur das geprueft, was echten
# Schaden anrichtet -- und dieser Satz ist heute vollstaendig gruen, jede rote
# CI ist also eine echte neue Regression.
#
# Bewusst NICHT aktiviert: F401, F541, F841, E722 (Upstream-Rauschen, kein
# Laufzeitfehler). Wer das aufraeumen will, macht das in einem eigenen
# Upstream-PR, nicht als CI-Zwang im Fork.

target-version = "py313"

# F821 "Undefined name `util`" (48x) ist ein Fehlalarm, kein Bug:
# `pysenec_ha/__init__.py` importiert in Zeile 110
#   from custom_components.senec.pysenec_ha.util import parse
# Dieser Import laedt das Submodul `util`, und Python haengt ein importiertes
# Submodul als Attribut an das Paket-Objekt. Die Attribute des Paket-Objekts
# SIND die Globals von `__init__.py` -- der Name `util` ist zur Laufzeit also
# gebunden, bevor die erste `util.mask_string(...)`-Zeile laeuft. Ruff kann
# diesen Seiteneffekt statisch nicht sehen.
#
# Genau EIN Name wird deshalb als vorab-gebunden deklariert. Die erste Fassung
# (26.07.2026) hat stattdessen per `per-file-ignores` F821 fuer die ganze Datei
# abgeschaltet -- also ausgerechnet fuer die Datei, in der praktisch die
# gesamte Fork-Arbeit stattfindet. Die Gegenlese hat das gefunden, die
# Gegenprobe hat es belegt: ein absichtlich eingebauter Tippfehler in dieser
# Datei lief mit der alten Fassung glatt durch ("All checks passed!") und wird
# mit dieser hier gefangen ("Found 1 error"). Ein Ausnahme-Eintrag darf nie
# breiter sein als der Fehlalarm, den er stillstellt.
builtins = ["util"]

[lint]
# E9  = Syntax-/Parse-Fehler        F63 = kaputte Vergleiche/Assertions
# F7  = Syntaxfehler im Kontext     F82 = undefinierte Namen
select = ["E9", "F63", "F7", "F82"]
